# Kopieer dit bestand naar config.yaml en vul het in.
# config.yaml staat in .gitignore — er komen géén geheimen in git.
# API keys en tokens gaan via omgevingsvariabelen (zie README).

defaults:
  # Hoeveel dagen terug bij de allereerste sync van een rekening.
  initial_sync_days: 30
  # sandbox: true          # alleen voor testen tegen de bunq-sandbox
  # state_file: .state/sync-state.json

companies:
  - name: bedrijf-1
    bunq:
      # Omgevingsvariabele met de bunq API key van dít bedrijf.
      api_key_env: BUNQ_API_KEY_BEDRIJF_1
      # wildcard_ip: true  # zet aan als de sync draait op wisselende IP-adressen
    moneybird:
      # Moneybird geeft API-tokens per administratie uit, dus elk bedrijf
      # heeft een eigen token (en eigen omgevingsvariabele) nodig.
      token_env: MONEYBIRD_TOKEN_BEDRIJF_1
      # Vind dit id met: bunq-moneybird list-moneybird
      administration_id: "123456789012345678"
    accounts:
      # Vind IBAN's met:               bunq-moneybird list-bunq --company bedrijf-1
      # Vind financial account ids met: bunq-moneybird list-moneybird
      - iban: NL00BUNQ0000000000
        moneybird_financial_account_id: "123456789012345678"
        # Optioneel: begin de allereerste sync pas op deze datum, in plaats
        # van initial_sync_days terug. Zet dit op de dag NA de laatste
        # transactie die een eerdere koppeling al importeerde, anders komen
        # die dubbel in Moneybird.
        # sync_from: "2026-07-15"

